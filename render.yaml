# Render Blueprint: New > Blueprint > pick this repo.
services:
  - type: web
    name: media-audio-studio
    runtime: docker
    plan: standard        # 2 GB RAM. "starter" (512 MB) is too small for vocal removal.
    healthCheckPath: /_stcore/health
    envVars:
      - key: MAX_UPLOAD_MB
        value: "200"
